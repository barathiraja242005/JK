<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK 2D Style</title>
<style>
  :root {
    --bg: #F3F4F7; --card: #FFFFFF; --stage: #EAEEF5; --floor: #D5DBE6; --mat: #C9D3E3;
    --text: #151821; --muted: #626B7C; --chip: #E3ECFD; --chipText: #1D4ED8; --shadow: rgba(20,30,50,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1015; --card: #171A21; --stage: #1E232D; --floor: #2C3340; --mat: #2A3446;
      --text: #ECEEF3; --muted: #9AA2B1; --chip: #1C2A45; --chipText: #8DB4FF; --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1015; --card: #171A21; --stage: #1E232D; --floor: #2C3340; --mat: #2A3446;
    --text: #ECEEF3; --muted: #9AA2B1; --chip: #1C2A45; --chipText: #8DB4FF; --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  .grid { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 2px 10px var(--shadow); }
  .stage { background: var(--stage); aspect-ratio: 4 / 3; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .info { padding: 12px 14px 16px; }
  .info h2 { font-size: 16px; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); color: var(--chipText); font-size: 12px; font-weight: 600;
          padding: 3px 9px; border-radius: 999px; }
  .chip.sec { background: transparent; color: var(--muted); border: 1px solid var(--floor); }
</style>
</head>
<body>
<header>
  <h1>Option 3: clean 2D illustration</h1>
  <p>Vector athlete drawn in code. Target muscle glows blue on each rep. Tiny file size, sharp at any screen size, works offline.</p>
</header>
<div class="grid" id="grid"></div>

<script>
// ---------- geometry (angle 0 = down, 90 = forward/right, 180 = up) ----------
const R = Math.PI / 180;
const D = a => [Math.sin(a * R), Math.cos(a * R)];
const add = (p, a, l) => { const d = D(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
const ang = (p, q) => Math.atan2(q[0] - p[0], q[1] - p[1]) / R;
const lerp = (a, b, t) => a + (b - a) * t;
const L = { thigh: 84, shin: 80, torso: 92, neck: 9, head: 17, ua: 52, fa: 48, foot: 25 };
const FLOOR = 262;

const C = {
  skin: '#EDBE9C', skinB: '#C8957A', hair: '#4A3A30',
  shirt: '#F2F4F8', shirtB: '#C3CAD6', shorts: '#4C566B', shortsB: '#3A4254',
  shoe: '#FF7A45', shoeB: '#C95A31', sole: '#FFFFFF',
  muscle: '#2F7BFF', plate: '#2A2F3A', plateRing: '#3F4656', hub: '#A3ABB9',
};

function fk(p) {
  const hip = [0, 0];
  const knee = add(hip, p.thigh, L.thigh);
  const ankle = add(knee, p.shin, L.shin);
  const toe = add(ankle, p.foot ?? 90, L.foot);
  const sh = add(hip, p.torso, L.torso);
  const ha = p.torso + (p.neck || 0);
  const neck = add(sh, ha, L.neck);
  const head = add(neck, ha, L.head);
  return { hip, knee, ankle, toe, sh, neck, head, ha };
}
function shift(P, dx, dy) {
  const o = { ha: P.ha };
  for (const k in P) if (Array.isArray(P[k])) o[k] = [P[k][0] + dx, P[k][1] + dy];
  return o;
}
function ik(S, T, a, b, bend) {
  let dx = T[0] - S[0], dy = T[1] - S[1];
  let d = Math.hypot(dx, dy);
  const dc = Math.min(Math.max(d, Math.abs(a - b) + 0.5), a + b - 0.5);
  const th = Math.atan2(dy, dx);
  const A = Math.acos((a * a + dc * dc - b * b) / (2 * a * dc));
  const e = [S[0] + a * Math.cos(th + bend * A), S[1] + a * Math.sin(th + bend * A)];
  const h = [S[0] + dx / d * dc, S[1] + dy / d * dc];
  return [e, h];
}

// ---------- drawing ----------
const f1 = n => n.toFixed(1);
function capsule(p1, r1, p2, r2, fill, extra = '') {
  const vx = p2[0] - p1[0], vy = p2[1] - p1[1], d = Math.hypot(vx, vy);
  let s = `<circle cx="${f1(p1[0])}" cy="${f1(p1[1])}" r="${r1}" fill="${fill}" ${extra}/>` +
          `<circle cx="${f1(p2[0])}" cy="${f1(p2[1])}" r="${r2}" fill="${fill}" ${extra}/>`;
  if (d > Math.abs(r1 - r2) + 0.01) {
    const th = Math.atan2(vy, vx), al = Math.acos((r1 - r2) / d);
    const P = (c, r, a) => `${f1(c[0] + r * Math.cos(a))},${f1(c[1] + r * Math.sin(a))}`;
    s += `<polygon points="${P(p1, r1, th + al)} ${P(p2, r2, th + al)} ${P(p2, r2, th - al)} ${P(p1, r1, th - al)}" fill="${fill}" ${extra}/>`;
  }
  return s;
}
const mix = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];

function leg(P, back) {
  const sk = back ? C.skinB : C.skin, sh = back ? C.shortsB : C.shorts;
  const shoe = back ? C.shoeB : C.shoe;
  return capsule(P.hip, 15, P.knee, 10, sk) +
         capsule(P.knee, 10, mix(P.knee, P.ankle, 0.3), 10.5, sk) +
         capsule(mix(P.knee, P.ankle, 0.3), 10.5, P.ankle, 6.5, sk) +
         capsule(P.hip, 16, mix(P.hip, P.knee, 0.5), 13.5, sh) +
         capsule(P.ankle, 8, P.toe, 5.5, shoe) +
         capsule(add(P.ankle, ang(P.ankle, P.toe) - 90, 6), 2.6, add(P.toe, ang(P.ankle, P.toe) - 90, 4), 2.2, C.sole);
}
function arm(S, E, H, back, item) {
  const sk = back ? C.skinB : C.skin, sl = back ? C.shirtB : C.shirt;
  let s = capsule(S, 9.5, E, 7, sk) + capsule(E, 7, H, 5, sk) +
          `<circle cx="${f1(H[0])}" cy="${f1(H[1])}" r="6.5" fill="${sk}"/>` +
          capsule(S, 11.5, mix(S, E, 0.38), 9.5, sl);
  if (item === 'dumbbell') s += dumbbell(H, back);
  return s;
}
function dumbbell(H, back) {
  const hex = (r, fill) => {
    let pts = [];
    for (let i = 0; i < 6; i++) { const a = (i * 60 + 30) * R; pts.push(`${f1(H[0] + r * Math.cos(a))},${f1(H[1] + r * Math.sin(a))}`); }
    return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`;
  };
  return hex(11, back ? '#20242D' : C.plate) + hex(6.5, back ? '#2D323D' : C.plateRing) +
         `<circle cx="${f1(H[0])}" cy="${f1(H[1])}" r="2.4" fill="${C.hub}"/>`;
}
function torso(P) {
  const ta = ang(P.hip, P.sh), chest = mix(P.hip, P.sh, 0.72);
  return capsule(P.hip, 16.5, chest, 19, C.shirt) + capsule(chest, 19, add(P.sh, ta, -2), 15, C.shirt) +
         `<circle cx="${f1(add(P.hip, ta + 90, 4)[0])}" cy="${f1(add(P.hip, ta + 90, 4)[1])}" r="15" fill="${C.shorts}"/>` +
         capsule(P.hip, 17, add(P.hip, ta, 12), 16.8, C.shorts) +
         capsule(add(P.hip, ta, 12), 17, add(P.hip, ta, 14.5), 17, '#2F3645');
}
function head(P) {
  const front = P.ha - 90, up = P.ha;
  const c = P.head;
  const hairC = add(add(c, front, -2.5), up, 2);
  const faceC = add(c, front, 1.5);
  const nose = add(add(c, front, 16.5), up, -1);
  const ear = add(c, front, -2);
  return capsule(P.sh, 7, P.neck, 6.5, C.skin) +
         `<circle cx="${f1(hairC[0])}" cy="${f1(hairC[1])}" r="17.5" fill="${C.hair}"/>` +
         `<circle cx="${f1(faceC[0])}" cy="${f1(faceC[1])}" r="16" fill="${C.skin}"/>` +
         `<circle cx="${f1(nose[0])}" cy="${f1(nose[1])}" r="3" fill="${C.skin}"/>` +
         capsule(add(add(c, front, -3), up, 3), 15.5, add(add(c, front, 6), up, 9.5), 9, C.hair) +
         `<circle cx="${f1(ear[0])}" cy="${f1(ear[1])}" r="3.6" fill="${C.skinB}"/>`;
}
// muscle: segment a->b, fraction range, radii, side (+1 = angle+90), offset
function muscle(a, b, m, k, id) {
  const sa = ang(a, b) + 90 * m.side;
  const p1 = add(mix(a, b, m.f[0]), sa, m.off), p2 = add(mix(a, b, m.f[1]), sa, m.off);
  const op = (0.55 + 0.45 * k).toFixed(2);
  return `<g opacity="${op}" filter="url(#glow-${id})">` + capsule(p1, m.r[0], p2, m.r[1], C.muscle) + '</g>';
}
function barbell(B) {
  return `<circle cx="${f1(B[0])}" cy="${f1(B[1])}" r="24" fill="${C.plate}"/>` +
         `<circle cx="${f1(B[0])}" cy="${f1(B[1])}" r="17" fill="none" stroke="${C.plateRing}" stroke-width="3"/>` +
         `<circle cx="${f1(B[0])}" cy="${f1(B[1])}" r="5" fill="${C.hub}"/>`;
}
const shadow = (x1, x2) => `<ellipse cx="${f1((x1 + x2) / 2)}" cy="${FLOOR + 1}" rx="${f1((x2 - x1) / 2 + 14)}" ry="5" fill="#000" opacity=".10"/>`;

// ---------- exercises ----------
const EX = [
  {
    name: 'Barbell Squat', primary: ['Quadriceps', 'Glutes'], secondary: ['Hamstrings', 'Lower back'],
    A: { thigh: -2, shin: 2, torso: 180, foot: 90, neck: 0 },
    B: { thigh: 80, shin: -27, torso: 136, foot: 90, neck: 30 },
    anchor: ['ankle', [175, FLOOR - 9]], scale: 0.78,
    draw(P, k, id) {
      const bar = add(add(P.sh, ang(P.hip, P.sh) + 90, 13), ang(P.hip, P.sh), 1);
      const [e, h] = ik(P.sh, add(bar, ang(P.hip, P.sh) - 90, 4), L.ua, L.fa, -1);
      const Pb = shift(P, -5, -2);
      const [eb, hb] = ik(Pb.sh, add(bar, ang(P.hip, P.sh) - 90, 4), L.ua, L.fa, -1);
      return shadow(P.ankle[0] - 10, P.toe[0]) +
        arm(Pb.sh, eb, hb, true) + leg(Pb, true) + torso(P) +
        muscle(P.hip, P.sh, { f: [0, 0.12], r: [13, 11], side: 1, off: 9 }, k, id) +
        leg(P, false) +
        muscle(P.hip, P.knee, { f: [0.18, 0.8], r: [10, 7.5], side: 1, off: 4 }, k, id) +
        head(P) + arm(P.sh, e, h, false) + barbell(bar);
    },
  },
  {
    name: 'Dumbbell Bicep Curl', primary: ['Biceps'], secondary: ['Forearms'],
    A: { thigh: -2, shin: 2, torso: 180, foot: 90, neck: 0, ua: 4, fa: 10 },
    B: { thigh: -2, shin: 2, torso: 180, foot: 90, neck: 0, ua: 14, fa: 152 },
    anchor: ['ankle', [180, FLOOR - 9]], scale: 0.78,
    draw(P, k, id, p) {
      const e = add(P.sh, p.ua, L.ua), h = add(e, p.fa, L.fa);
      const Pb = shift(P, -5, -2);
      const eb = add(Pb.sh, p.ua, L.ua), hb = add(eb, p.fa, L.fa);
      return shadow(P.ankle[0] - 10, P.toe[0]) +
        arm(Pb.sh, eb, hb, true, 'dumbbell') + leg(Pb, true) + torso(P) + leg(P, false) + head(P) +
        arm(P.sh, e, h, false, 'dumbbell') +
        muscle(P.sh, e, { f: [0.22, 0.85], r: [7, 5.5], side: 1, off: 3.5 }, k, id);
    },
  },
  {
    name: 'Push-Up', primary: ['Chest', 'Triceps'], secondary: ['Shoulders', 'Core'],
    A: { thigh: 284, shin: 284, torso: 104, foot: 12, neck: 0 },
    B: { thigh: 273.5, shin: 273.5, torso: 93.5, foot: 4, neck: 0 },
    anchor: ['toe', [30, FLOOR - 4]], scale: 0.9,
    mat: true,
    draw(P, k, id, p, ex) {
      const T = ex.hand;
      const [e, h] = ik(P.sh, T, L.ua, L.fa, -1);
      const Pb = shift(P, -4, -2);
      const [eb, hb] = ik(Pb.sh, [T[0] - 4, T[1]], L.ua, L.fa, -1);
      return shadow(P.toe[0], P.head[0]) +
        arm(Pb.sh, eb, hb, true) + leg(Pb, true) + torso(P) +
        muscle(P.hip, P.sh, { f: [0.62, 0.9], r: [10, 11], side: -1, off: 8 }, k, id) +
        leg(P, false) + head(P) + arm(P.sh, e, h, false) +
        muscle(P.sh, e, { f: [0.2, 0.85], r: [6.5, 5.5], side: -1, off: 3.5 }, k, id);
    },
    setup(ex) {
      const P = place(ex, ex.A);
      ex.hand = [P.sh[0] + 6, FLOOR - 7];
    },
  },
  {
    name: 'Crunches', primary: ['Abs'], secondary: ['Obliques'],
    A: { thigh: 140, shin: 22, torso: 270, foot: 90, neck: 0 },
    B: { thigh: 140, shin: 22, torso: 238, foot: 90, neck: -18 },
    anchor: ['hip', [220, FLOOR - 18]], scale: 0.95,
    mat: true,
    draw(P, k, id) {
      const front = P.ha - 90;
      const T = add(add(P.head, front, -13), P.ha, 2);
      const [e, h] = ik(P.sh, T, L.ua, L.fa, 1);
      const Pb = shift(P, -3, -3);
      const [eb, hb] = ik(Pb.sh, add(T, 0, 0), L.ua, L.fa, 1);
      return shadow(P.head[0] - 10, P.toe[0]) +
        arm(Pb.sh, eb, hb, true) + leg(Pb, true) + torso(P) +
        muscle(P.hip, P.sh, { f: [0.18, 0.62], r: [9, 9.5], side: -1, off: 9 }, k, id) +
        leg(P, false) + head(P) + arm(P.sh, e, h, false);
    },
  },
];

function place(ex, p) {
  const P = fk(p);
  const [key, at] = ex.anchor;
  return shift(P, at[0] - P[key][0], at[1] - P[key][1]);
}
function ease(t) { // hold - go - hold - return
  const ph = t % 1;
  const s = x => x * x * (3 - 2 * x);
  if (ph < 0.08) return 0;
  if (ph < 0.48) return s((ph - 0.08) / 0.4);
  if (ph < 0.58) return 1;
  return 1 - s((ph - 0.58) / 0.42);
}

// ---------- page ----------
const grid = document.getElementById('grid');
EX.forEach((ex, i) => {
  ex.setup?.(ex);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="stage"><svg viewBox="0 0 360 290" aria-label="${ex.name} animation">
      <defs><filter id="glow-${i}" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>
      <radialGradient id="spot-${i}" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <rect width="360" height="290" fill="url(#spot-${i})"/>
      <rect x="0" y="${FLOOR}" width="360" height="40" fill="var(--floor)"/>
      ${ex.mat ? `<rect x="20" y="${FLOOR - 4}" width="320" height="6" rx="3" fill="var(--mat)"/>` : ''}
      <g class="fig"></g>
    </svg></div>
    <div class="info"><h2>${ex.name}</h2><div class="chips">
      ${ex.primary.map(m => `<span class="chip">${m}</span>`).join('')}
      ${ex.secondary.map(m => `<span class="chip sec">${m}</span>`).join('')}
    </div></div>`;
  grid.appendChild(card);
  ex.g = card.querySelector('.fig');
  const [ax, ay] = ex.anchor[1], sc = ex.scale || 1;
  ex.g.setAttribute('transform', `translate(${ax} ${ay}) scale(${sc}) translate(${-ax} ${-ay})`);
  ex.id = i;
});

const PERIOD = 2.6;
const FREEZE = new URLSearchParams(location.search).get('k');
function frame(ms) {
  const k = FREEZE !== null ? +FREEZE : ease(ms / 1000 / PERIOD);
  for (const ex of EX) {
    const p = {};
    for (const key in ex.A) p[key] = lerp(ex.A[key], ex.B[key], k);
    ex.g.innerHTML = ex.draw(place(ex, p), k, ex.id, p, ex);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
